<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="めもーず">
<meta name="theme-color" content="#F6F2EA">
<title>めもーず</title>
<style>
  :root{
    --paper: #F6F2EA;
    --paper-dot: #E7DFCF;
    --ink: #2B2924;
    --ink-soft: #6B6558;
    --card: #FFFFFF;
    --card-border: #E9E2D3;
    --teal: #3E6B65;
    --teal-soft: #E4EDEA;
    --gold: #AD7F26;
    --gold-soft: #F3E9D3;
    --plum: #7C5679;
    --plum-soft: #EFE4EE;
    --red: #B3503F;
    --green: #4C7A5D;
    --amber: #C1762E;
    --amber-soft: #F3E4D0;
    --sage: #4F7657;
    --sage-soft: #E2ECE2;
    --coral: #B5566B;
    --coral-soft: #F3E1E6;
    --blue: #3E6B8C;
    --blue-soft: #E1EAF0;
    --shadow: 0 2px 10px rgba(43,41,36,0.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;}
  body{
    font-family: "Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",-apple-system,BlinkMacSystemFont,sans-serif;
    color:var(--ink);
    background-color:var(--paper);
    background-image: radial-gradient(var(--paper-dot) 1px, transparent 1px);
    background-size: 16px 16px;
    height:100vh;
    height:100dvh;
  }
  #app{
    max-width:480px;
    margin:0 auto;
    height:100vh;
    height:100dvh;
    display:flex;
    flex-direction:column;
    background: transparent;
    overflow:hidden;
  }
  .header{
    padding:22px 20px 14px 20px;
    display:flex;
    align-items:baseline;
    gap:10px;
    position:relative;
    flex-shrink:0;
  }
  .header h1{
    font-size:26px;
    margin:0;
    letter-spacing:1px;
    font-weight:800;
    color:var(--ink);
  }
  .header .sub{
    font-size:12px;
    color:var(--ink-soft);
  }
  .settings-btn{
    position:absolute;
    right:20px;
    top:22px;
    border:none;
    background:var(--card);
    box-shadow:var(--shadow);
    border-radius:50%;
    width:34px;height:34px;
    font-size:16px;
    cursor:pointer;
    color:var(--ink-soft);
  }
  .subheader{
    display:flex;
    align-items:center;
    gap:10px;
    padding:16px 16px 10px 16px;
    flex-shrink:0;
  }
  .backbtn{
    border:none;
    background:var(--card);
    box-shadow:var(--shadow);
    border-radius:50%;
    width:36px;height:36px;
    font-size:18px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    color:var(--ink);
    flex-shrink:0;
  }
  .subheader h2{
    font-size:18px;
    margin:0;
    font-weight:800;
  }
  .main{
    flex:1;
    padding:0 16px 16px 16px;
    display:flex;
    flex-direction:column;
    min-height:0;
    overflow-y:auto;
  }
  /* ---- home: todo section ---- */
  .todo-section{
    flex:1;
    display:flex;
    flex-direction:column;
    min-height:0;
  }
  .section-title{
    font-size:13px;
    color:var(--ink-soft);
    font-weight:700;
    margin:4px 0 8px 4px;
    letter-spacing:1px;
  }
  .todo-list{
    flex:1;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:8px;
    padding-bottom:8px;
  }
  .todo-card{
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:14px;
    padding:12px 14px;
    display:flex;
    align-items:flex-start;
    gap:10px;
    box-shadow:var(--shadow);
    cursor:pointer;
  }
  .todo-check{
    width:22px;height:22px;
    border-radius:50%;
    border:2px solid var(--teal);
    flex-shrink:0;
    margin-top:1px;
    display:flex;align-items:center;justify-content:center;
    background:transparent;
    cursor:pointer;
  }
  .todo-check.done{
    background:var(--teal);
  }
  .todo-check.done::after{
    content:"✓";
    color:white;
    font-size:13px;
    font-weight:bold;
  }
  .todo-body{flex:1; min-width:0;}
  .todo-text{
    font-size:15px;
    font-weight:600;
    word-break:break-word;
  }
  .todo-text.done{
    text-decoration:line-through;
    color:var(--ink-soft);
    font-weight:500;
  }
  .todo-deadline{
    font-size:12px;
    margin-top:4px;
    display:inline-block;
    padding:2px 8px;
    border-radius:8px;
    background:var(--teal-soft);
    color:var(--teal);
    font-weight:700;
  }
  .todo-deadline.warn{background:#F6E4DF; color:var(--red);}
  .empty-state{
    text-align:center;
    color:var(--ink-soft);
    font-size:13px;
    padding:30px 10px;
    line-height:1.7;
  }
  .fab{
    position:absolute;
    bottom:100px;
    right:24px;
    width:52px;height:52px;
    border-radius:50%;
    background:var(--teal);
    color:white;
    font-size:26px;
    border:none;
    box-shadow:0 4px 14px rgba(62,107,101,0.4);
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    line-height:0;
  }
  /* ---- bottom nav ---- */
  .bottom-nav{
    display:flex;
    flex-direction:column;
    gap:8px;
    padding:12px 16px calc(16px + env(safe-area-inset-bottom,0px)) 16px;
    background:var(--card);
    border-top:1px dashed var(--card-border);
    position:relative;
    flex-shrink:0;
  }
  .nav-row{display:flex; gap:8px;}
  .bottom-nav::before{
    content:"";
    position:absolute;
    top:-1px; left:20px; right:20px;
    height:1px;
    background:repeating-linear-gradient(90deg, var(--card-border) 0 6px, transparent 6px 10px);
  }
  .nav-btn{
    flex:1;
    background:var(--paper);
    border:1px solid var(--card-border);
    border-radius:14px;
    padding:9px 4px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
    cursor:pointer;
    color:var(--ink);
    min-width:0;
  }
  .nav-btn .icon{font-size:18px; line-height:1;}
  .nav-btn .label{font-size:10.5px; font-weight:700; white-space:nowrap;}
  .nav-btn .amount{font-size:11px; font-weight:800; white-space:nowrap;}
  .nav-btn.shift .amount{color:var(--gold);}
  .nav-btn.personal .amount{color:var(--teal);}
  .nav-btn.ent .amount{color:var(--plum);}
  .nav-btn.calorie .amount{color:var(--amber);}
  .nav-btn.dish .amount{color:var(--sage);}
  .nav-btn.want .amount{color:var(--coral);}
  .nav-btn.place .amount{color:var(--blue);}
  /* ---- month list ---- */
  .month-list{display:flex; flex-direction:column; gap:10px;}
  .month-card{
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:14px;
    padding:16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:var(--shadow);
    cursor:pointer;
  }
  .month-card .month-label{font-size:15px; font-weight:700;}
  .month-card .month-total{font-size:18px; font-weight:800;}
  .add-btn{
    width:100%;
    padding:14px;
    border-radius:14px;
    border:none;
    background:var(--teal);
    color:white;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    margin-bottom:14px;
  }
  .add-btn.personal{background:var(--teal);}
  .add-btn.shift{background:var(--gold);}
  .add-btn.ent{background:var(--plum);}
  .add-btn.calorie{background:var(--amber);}
  .add-btn.dish{background:var(--sage);}
  .add-btn.want{background:var(--coral);}
  .add-btn.place{background:var(--blue);}
  .year-btn{
    width:100%;
    padding:12px;
    border-radius:14px;
    border:1px dashed var(--card-border);
    background:var(--card);
    color:var(--ink);
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    margin-bottom:16px;
  }
  .year-chip-row{display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:14px;}
  .year-chip{
    padding:9px 16px;
    border-radius:999px;
    border:1px solid var(--card-border);
    background:var(--card);
    font-size:14px;
    font-weight:800;
    cursor:pointer;
    color:var(--ink-soft);
    white-space:nowrap;
    flex-shrink:0;
  }
  .year-chip.active.personal{background:var(--teal); border-color:var(--teal); color:white;}
  .year-chip.active.ent{background:var(--plum); border-color:var(--plum); color:white;}
  .year-chip.active.shift{background:var(--gold); border-color:var(--gold); color:white;}
  .year-chip.active.calorie{background:var(--amber); border-color:var(--amber); color:white;}
  .year-month-card{
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:14px;
    padding:14px 16px;
    margin-bottom:10px;
    box-shadow:var(--shadow);
    cursor:pointer;
  }
  .year-month-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;}
  .year-month-head .m-label{font-size:14px; font-weight:800;}
  .year-month-head .m-total{font-size:16px; font-weight:800;}
  .breakdown-row{
    display:flex;
    justify-content:space-between;
    font-size:12px;
    color:var(--ink-soft);
    padding:3px 0;
    border-top:1px dotted var(--card-border);
  }
  .breakdown-row:first-child{border-top:none;}
  .entry-left .entry-comment{font-size:11px; color:var(--ink-soft); margin-top:3px; font-style:italic;}
  /* ---- entry list (in month detail) ---- */
  .entry-card{
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:12px;
    padding:12px 14px;
    margin-bottom:8px;
    box-shadow:var(--shadow);
    cursor:pointer;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
  }
  .entry-left .entry-date{font-size:12px; color:var(--ink-soft); font-weight:700;}
  .entry-left .entry-type{font-size:14px; font-weight:700; margin-top:2px;}
  .entry-left .entry-sub{font-size:12px; color:var(--ink-soft); margin-top:2px;}
  .entry-amount{font-size:16px; font-weight:800; white-space:nowrap;}
  .entry-amount.neg{color:var(--red);}
  .entry-amount.pos{color:var(--green);}
  .entry-right{display:flex; align-items:center; gap:10px; flex-shrink:0;}
  .entry-del{
    border:none;
    background:transparent;
    font-size:16px;
    cursor:pointer;
    padding:4px;
    line-height:1;
    opacity:0.55;
  }
  .entry-del:hover, .entry-del:active{opacity:1;}
  /* ---- form ---- */
  .form-group{margin-bottom:16px;}
  .form-label{font-size:12px; font-weight:700; color:var(--ink-soft); margin-bottom:6px; display:block;}
  input[type=text], input[type=date], textarea{
    width:100%;
    border:1px solid var(--card-border);
    background:var(--card);
    border-radius:10px;
    padding:11px 12px;
    font-size:15px;
    font-family:inherit;
    color:var(--ink);
  }
  textarea{resize:vertical; min-height:90px;}
  .chip-row{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{
    padding:9px 14px;
    border-radius:999px;
    border:1px solid var(--card-border);
    background:var(--card);
    font-size:13px;
    font-weight:700;
    cursor:pointer;
    color:var(--ink-soft);
  }
  .chip.active{
    background:var(--teal);
    border-color:var(--teal);
    color:white;
  }
  .chip.active.shiftc{background:var(--gold); border-color:var(--gold);}
  .chip.active.entc{background:var(--plum); border-color:var(--plum);}
  .chip.active.caloriec{background:var(--amber); border-color:var(--amber);}
  .chip.active.placec{background:var(--blue); border-color:var(--blue); color:white;}
  .stepper{
    display:flex;
    align-items:center;
    gap:14px;
  }
  .stepper button{
    width:36px;height:36px;
    border-radius:50%;
    border:1px solid var(--card-border);
    background:var(--card);
    font-size:18px;
    cursor:pointer;
    color:var(--ink);
  }
  .stepper .val{font-size:17px; font-weight:800; min-width:28px; text-align:center;}
  .amount-preview{
    background:var(--gold-soft);
    border-radius:12px;
    padding:14px;
    text-align:center;
    margin-bottom:16px;
  }
  .amount-preview .num{font-size:24px; font-weight:800; color:var(--gold);}
  .amount-preview .cap{font-size:11px; color:var(--ink-soft); font-weight:700;}
  .save-btn{
    width:100%;
    padding:14px;
    border-radius:14px;
    border:none;
    background:var(--ink);
    color:white;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    margin-top:6px;
  }
  .delete-btn{
    width:100%;
    padding:12px;
    border-radius:14px;
    border:1px solid var(--red);
    background:transparent;
    color:var(--red);
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    margin-top:10px;
  }
  .settings-card{
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:14px;
    padding:16px;
    margin-bottom:14px;
    box-shadow:var(--shadow);
  }
  .settings-card h3{margin:0 0 6px 0; font-size:14px; font-weight:800;}
  .settings-card p{margin:0 0 12px 0; font-size:12.5px; color:var(--ink-soft); line-height:1.6;}
  .settings-btn-row{display:flex; flex-direction:column; gap:10px;}
  .backup-btn{
    padding:12px;
    border-radius:12px;
    border:none;
    background:var(--teal);
    color:white;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    text-align:center;
  }
  .restore-label{
    padding:12px;
    border-radius:12px;
    border:1px dashed var(--card-border);
    background:var(--paper);
    color:var(--ink);
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    text-align:center;
    display:block;
  }
  .settings-status{font-size:12px; color:var(--teal); margin-top:8px; font-weight:700; min-height:16px;}
  .sign-row{display:flex; gap:8px;}
  .sign-btn{
    flex:1;
    padding:12px;
    border-radius:12px;
    border:1px solid var(--card-border);
    background:var(--card);
    font-size:15px;
    font-weight:800;
    cursor:pointer;
  }
  .sign-btn.plus.active{background:var(--green); border-color:var(--green); color:white;}
  .sign-btn.minus.active{background:var(--red); border-color:var(--red); color:white;}

  /* ---- calorie unknown toggle ---- */
  .unknown-toggle{
    padding:12px;
    border-radius:12px;
    border:1px solid var(--card-border);
    background:var(--card);
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    text-align:center;
    color:var(--ink-soft);
  }
  .unknown-toggle.active{background:var(--amber-soft); border-color:var(--amber); color:var(--amber);}

  /* ---- dish (cooking record) ---- */
  .dish-card{
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:14px;
    padding:14px 16px;
    margin-bottom:10px;
    box-shadow:var(--shadow);
    cursor:pointer;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
  }
  .dish-card .dish-name{font-size:15px; font-weight:700;}
  .dish-card .dish-sub{font-size:12px; color:var(--ink-soft); margin-top:3px;}
  .dish-card .dish-arrow{color:var(--card-border); font-size:18px;}
  .dish-header-card{
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:14px;
    padding:16px;
    margin-bottom:16px;
    box-shadow:var(--shadow);
  }
  .dish-header-card h2{margin:0 0 8px 0; font-size:19px; font-weight:800;}
  .dish-link-row{font-size:13px; margin-top:4px; word-break:break-all;}
  .dish-link-row a{color:var(--sage); text-decoration:underline;}
  .dish-edit-link{font-size:12px; color:var(--ink-soft); text-decoration:underline; cursor:pointer; margin-top:10px; display:inline-block;}
  .version-card{
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:14px;
    padding:14px 16px;
    margin-bottom:10px;
    box-shadow:var(--shadow);
    cursor:pointer;
  }
  .version-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;}
  .version-badge{
    background:var(--sage-soft); color:var(--sage);
    font-size:12px; font-weight:800;
    padding:3px 10px; border-radius:999px;
  }
  .version-date{font-size:12px; color:var(--ink-soft); font-weight:700;}
  .version-recipe{font-size:13px; color:var(--ink); white-space:pre-wrap; margin-bottom:6px; line-height:1.6;}
  .version-impression{font-size:12.5px; color:var(--ink-soft); border-top:1px dotted var(--card-border); padding-top:6px; white-space:pre-wrap;}
  .version-del{border:none; background:transparent; font-size:15px; cursor:pointer; opacity:0.5; padding:2px;}

  /* ---- search / places / wants ---- */
  .search-input{
    width:100%;
    border:1px solid var(--card-border);
    background:var(--card);
    border-radius:12px;
    padding:11px 14px;
    font-size:14px;
    font-family:inherit;
    color:var(--ink);
    margin-bottom:14px;
  }
  .place-card, .want-card{
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:14px;
    padding:14px 16px;
    margin-bottom:10px;
    box-shadow:var(--shadow);
    cursor:pointer;
  }
  .place-card .p-name, .want-card .w-name{font-size:15px; font-weight:700;}
  .place-card .p-sub, .want-card .w-sub{font-size:12px; color:var(--ink-soft); margin-top:4px; line-height:1.6;}
  .place-tag{
    display:inline-block;
    background:var(--blue-soft); color:var(--blue);
    font-size:11px; font-weight:700;
    padding:2px 8px; border-radius:999px;
    margin:3px 4px 0 0;
  }
  .status-badge{
    display:inline-block;
    font-size:10.5px; font-weight:800;
    padding:2px 8px; border-radius:999px;
    background:var(--amber-soft); color:var(--amber);
    vertical-align:middle;
  }
  .status-badge.done{background:var(--sage-soft); color:var(--sage);}
  .want-link-row{font-size:12px; margin-top:3px; word-break:break-all;}
  .want-link-row a{color:var(--coral); text-decoration:underline;}
  .loading{padding:40px; text-align:center; color:var(--ink-soft); font-size:13px;}
  ::-webkit-scrollbar{width:0;height:0;}
</style>
</head>
<body>
<div id="app"><div class="loading">読み込み中…</div></div>

<script>
(function(){
  const CATS = {
    shiftTypes: ["加須当直","彩の国当直","加須1日","彩の国1日"],
    personalCats: ["ジュース","コンビニ：おやつ","コンビニ：朝","コンビニ：昼","コンビニ：夜","外食：朝","外食：昼","飲み会：一人","飲み会：複数","日本酒/ワイン"],
    entCats: ["パチスロ","麻雀"],
    mealTypes: ["朝食","昼食","夕食","おやつ"],
    placeTags: ["居酒屋","魚","肉","こだわりビール","メキシコ","日本料理","イタリア","おでん","刺身","すし"]
  };

  let todos = [];
  let shifts = [];
  let personals = [];
  let ents = [];
  let calories = [];
  let dishes = [];
  let wants = [];
  let places = [];

  let state = { page: 'home' };

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
  function yen(n){ return "¥" + Math.round(n).toLocaleString('ja-JP'); }
  function kcal(n){ return Math.round(n).toLocaleString('ja-JP') + " kcal"; }
  function todayStr(){ const d = new Date(); return d.toISOString().slice(0,10); }
  function monthKeyOf(dateStr){ return dateStr ? dateStr.slice(0,7) : ''; }
  function monthLabel(key){
    if(!key) return '';
    const [y,m] = key.split('-');
    return y + '年' + parseInt(m,10) + '月';
  }
  function fmtDate(dateStr){
    if(!dateStr) return '';
    const [y,m,d] = dateStr.split('-');
    return parseInt(m,10) + '/' + parseInt(d,10);
  }

  // this app is a standalone page: data is saved to the browser's own local storage
  // (independent of Claude), so it works fully offline once installed on your phone.
  async function loadArr(key){
    try{
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : [];
    }catch(e){ return []; }
  }
  async function saveArr(key, arr){
    try{ localStorage.setItem(key, JSON.stringify(arr)); }
    catch(e){ console.error('save failed', key, e); }
  }

  function shiftBaseAmount(type){
    switch(type){
      case '加須当直': return 80000;
      case '彩の国当直': return 70000;
      case '加須1日': return 170000;
      case '彩の国1日': return 140000;
      default: return 0;
    }
  }
  function computeShiftAmount(type, ambulance, admission){
    ambulance = ambulance||0; admission = admission||0;
    return shiftBaseAmount(type) + (ambulance+admission)*3000;
  }

  function groupByMonth(list, dateKey){
    const map = {};
    list.forEach(item=>{
      const k = monthKeyOf(item[dateKey]);
      if(!map[k]) map[k] = [];
      map[k].push(item);
    });
    return Object.keys(map).sort().reverse().map(k=>({key:k, items:map[k]}));
  }

  function getYears(list, dateKey){
    const s = new Set();
    list.forEach(i=>{ if(i[dateKey]) s.add(i[dateKey].slice(0,4)); });
    const arr = Array.from(s).sort().reverse();
    return arr.length ? arr : [String(new Date().getFullYear())];
  }

  function go(page, params){
    state = Object.assign({page}, params||{});
    try{ history.pushState(state, '', '#'+page); }catch(e){}
    render();
  }

  // helpers for clickable phone / address / urls
  function telLink(phone){
    if(!phone) return '';
    return '<a href="tel:'+escapeHtml(phone.replace(/[^0-9+]/g,''))+'">📞 '+escapeHtml(phone)+'</a>';
  }
  function mapsLink(address){
    if(!address) return '';
    return '<a href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(address)+'" target="_blank" rel="noopener">📍 '+escapeHtml(address)+'</a>';
  }
  function urlLinksHtml(urls, cls){
    return (urls||[]).map(u=>'<div class="'+(cls||'dish-link-row')+'">🔗 <a href="'+escapeHtml(u)+'" target="_blank" rel="noopener">'+escapeHtml(u)+'</a></div>').join('');
  }

    if(state.page === 'shiftList') return renderYearMonthList(app, {
      title:'当直メモ', data:shifts, dateKey:'date', catKey:'type', navClass:'shift',

      onAdd:()=>go('shiftForm',{}),

    });
    if(state.page === 'shiftMonth') return renderShiftMonth(app);
    if(state.page === 'shiftForm') return renderShiftForm(app);
    if(state.page === 'personalList') return renderYearMonthList(app, {

      onAdd:()=>go('personalForm',{}),
      amountOf:(it)=>it.amount
    });
    if(state.page === 'personalMonth') return renderPersonalMonth(app);
    if(state.page === 'personalForm') return renderPersonalForm(app);

    });

    if(state.page === 'entForm') return renderEntForm(app);
    if(state.page === 'calorieList') return renderYearMonthList(app, {
      title:'摂取カロリー', data:calories, dateKey:'date', catKey:'meal', navClass:'calorie',
      onMonth:(k)=>go('calorieMonth',{monthKey:k}),
      onAdd:()=>go('calorieForm',{}),
      amountOf:(it)=> it.unknown ? 0 : (it.calories||0),
      formatAmount:kcal,

    if(state.page === 'placeInfoForm') return renderPlaceInfoForm(app);

  function el(tag, cls, html){
    const e = document.createElement(tag);
    if(cls) e.className = cls;
    if(html!==undefined) e.innerHTML = html;
    return e;
  }

  // ---------- HOME ----------
  function renderHome(app){
    const header = el('div','header');
    header.innerHTML = '<h1>めもーず</h1><span class="sub">個人用メモ</span>';
    const settingsBtn = el('button','settings-btn','⚙');
    settingsBtn.onclick = ()=> go('settings',{});
    header.appendChild(settingsBtn);
    app.appendChild(header);

    const main = el('div','main');
    main.style.position = 'relative';

    const todoSection = el('div','todo-section');
    todoSection.appendChild(el('div','section-title','やること'));

    const list = el('div','todo-list');
    const sorted = [...todos].sort((a,b)=>{
      if(a.done !== b.done) return a.done ? 1 : -1;
      if(!a.deadline && !b.deadline) return 0;
      if(!a.deadline) return 1;
      if(!b.deadline) return -1;
      return a.deadline.localeCompare(b.deadline);
    });

    if(sorted.length === 0){
      list.appendChild(el('div','empty-state','やることがありません。右下の＋から追加しましょう。'));
    } else {
      sorted.forEach(t=>{
        const card = el('div','todo-card');
        const chk = el('div','todo-check' + (t.done?' done':''));
        chk.onclick = (ev)=>{ ev.stopPropagation(); t.done = !t.done; saveArr('memoz_todos', todos); render(); };
        const body = el('div','todo-body');
        const textEl = el('div','todo-text' + (t.done?' done':''), escapeHtml(t.text));
        body.appendChild(textEl);
        if(t.deadline){
          const isSoon = !t.done && isDeadlineSoon(t.deadline);
          const dl = el('span','todo-deadline' + (isSoon?' warn':''), '期限 ' + t.deadline.replace(/-/g,'/'));
          body.appendChild(dl);
        }
        card.appendChild(chk);
        card.appendChild(body);
        card.onclick = ()=> go('todoForm', {editId: t.id});
        list.appendChild(card);
      });
    }
    todoSection.appendChild(list);
    main.appendChild(todoSection);

    const fab = el('button','fab','＋');
    fab.onclick = ()=> go('todoForm', {});
    main.appendChild(fab);

    app.appendChild(main);

    const nav = el('div','bottom-nav');

    rowTop.appendChild(navBtn('欲しいもの','want', wants.length + '件', ()=>go('wantList',{})));
    rowTop.appendChild(navBtn('行きたい店','place', places.length + '件', ()=>go('placeList',{})));
    rowTop.appendChild(navBtn('料理記録','dish', dishes.length + '品', ()=>go('dishList',{})));
    const rowBottom = el('div','nav-row');
    rowBottom.appendChild(navBtn('当直メモ','shift', yen(shiftMonthTotal(currentMonthKey())), ()=>go('shiftList',{})));
    rowBottom.appendChild(navBtn('個人出費','personal', yen(sumMonth(personals,'date','amount',currentMonthKey())), ()=>go('personalList',{})));
    rowBottom.appendChild(navBtn('摂取カロリー','calorie', kcal(calorieMonthTotal(currentMonthKey())), ()=>go('calorieList',{})));
    rowBottom.appendChild(navBtn('娯楽出費','ent', entMonthTotalStr(currentMonthKey()), ()=>go('entList',{})));
    nav.appendChild(rowTop);
    nav.appendChild(rowBottom);
    app.appendChild(nav);

  function navBtn(label, cls, valueText, onClick){
    const btn = el('div','nav-btn ' + cls);
    const icons = {shift:'🏥', personal:'👛', ent:'🎲', calorie:'🍚', dish:'🍳', want:'🛍', place:'🏮'};
    btn.innerHTML = '<div class="icon">'+icons[cls]+'</div><div class="label">'+label+'</div><div class="amount">'+valueText+'</div>';
    btn.onclick = onClick;
    return btn;
  }

  function currentMonthKey(){ return todayStr().slice(0,7); }
  function sumMonth(list, dateKey, amtKey, monthKey){
    return list.filter(i=>monthKeyOf(i[dateKey])===monthKey).reduce((s,i)=>s+i[amtKey],0);
  }
  function shiftMonthTotal(monthKey){
    return shifts.filter(i=>monthKeyOf(i.date)===monthKey).reduce((s,i)=>s+i.amount,0);
  }
  function entMonthTotal(monthKey){
    return ents.filter(i=>monthKeyOf(i.date)===monthKey).reduce((s,i)=>s + (i.sign==='minus'?-i.amount:i.amount),0);
  }
  function entMonthTotalStr(monthKey){
    const t = entMonthTotal(monthKey);
    return (t<0?'−':'+') + yen(Math.abs(t));
  }
  function calorieMonthTotal(monthKey){
    return calories.filter(i=>monthKeyOf(i.date)===monthKey && !i.unknown).reduce((s,i)=>s+(i.calories||0),0);
  }

  function isDeadlineSoon(deadline){
    const d = new Date(deadline);
    const now = new Date(todayStr());
    const diff = (d-now)/(1000*60*60*24);
    return diff <= 2;
  }

  function escapeHtml(s){
    return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function subHeader(app, title, onBack){
    const sh = el('div','subheader');
    const back = el('button','backbtn','←');
    back.onclick = onBack;
    sh.appendChild(back);
    sh.appendChild(el('h2',null,title));
    app.appendChild(sh);
  }

  // ---------- generic month list page ----------
  // ---------- unified list page: add button + year tabs + per-month breakdown ----------
  function renderYearMonthList(app, cfg){
    const fmt = cfg.formatAmount || yen;
    subHeader(app, cfg.title, ()=>go('home',{}));
    const main = el('div','main');
    const addBtn = el('button','add-btn ' + cfg.navClass, '＋ 新規登録');
    addBtn.onclick = cfg.onAdd;
    main.appendChild(addBtn);

    if(cfg.data.length===0){
      main.appendChild(el('div','empty-state','まだ記録がありません。＋新規登録から追加しましょう。'));
      app.appendChild(main);
      return;
    }

    const years = getYears(cfg.data, cfg.dateKey);
    const yearStateKey = 'year_' + cfg.navClass;
    const year = state[yearStateKey] && years.includes(state[yearStateKey]) ? state[yearStateKey] : years[0];

    const yearRow = el('div','year-chip-row');
    years.forEach(y=>{
      const chip = el('div','year-chip ' + cfg.navClass + (y===year?' active':''), y+'年');
      chip.onclick = ()=>{ state[yearStateKey] = y; render(); };
      yearRow.appendChild(chip);
    });
    main.appendChild(yearRow);

    const yearItems = cfg.data.filter(i=> (i[cfg.dateKey]||'').slice(0,4) === year);
    const yearTotal = yearItems.reduce((s,it)=>s+cfg.amountOf(it),0);
    const yearNote = cfg.noteOf ? cfg.noteOf(yearItems) : '';
    main.appendChild(el('div','amount-preview','<div class="num" style="color:'+(yearTotal<0?'var(--red)':'var(--ink)')+'">'+fmt(yearTotal)+'</div><div class="cap">'+year+'年 合計'+(yearNote?'　'+yearNote:'')+'</div>'));

    const byMonth = {};
    yearItems.forEach(it=>{
      const mk = it[cfg.dateKey].slice(5,7);
      if(!byMonth[mk]) byMonth[mk] = [];
      byMonth[mk].push(it);
    });
    const months = Object.keys(byMonth).sort().reverse();

    if(months.length===0){
      main.appendChild(el('div','empty-state', year+'年の記録がありません。'));
    } else {
      months.forEach(mk=>{
        const items = byMonth[mk];
        const monthKey = year + '-' + mk;
        const total = items.reduce((s,it)=>s+cfg.amountOf(it),0);
        const monthNote = cfg.noteOf ? cfg.noteOf(items) : '';
        const card = el('div','year-month-card');
        card.onclick = ()=> cfg.onMonth(monthKey);
        const head = el('div','year-month-head');
        head.innerHTML = '<span class="m-label">'+parseInt(mk,10)+'月'+(monthNote?' <span style="font-size:11px;font-weight:600;color:var(--ink-soft);">'+monthNote+'</span>':'')+'</span><span class="m-total" style="color:'+(total<0?'var(--red)':'var(--ink)')+'">'+(total<0?'−':'')+fmt(Math.abs(total))+'</span>';
        card.appendChild(head);

        const byCat = {};
        const byCatItems = {};
        items.forEach(it=>{
          const c = it[cfg.catKey];
          byCat[c] = (byCat[c]||0) + cfg.amountOf(it);
          if(!byCatItems[c]) byCatItems[c] = [];
          byCatItems[c].push(it);
        });
        Object.keys(byCat).sort((a,b)=>Math.abs(byCat[b])-Math.abs(byCat[a])).forEach(c=>{
          const amt = byCat[c];
          const note = cfg.noteOf ? cfg.noteOf(byCatItems[c]) : '';
          const row = el('div','breakdown-row');
          row.innerHTML = '<span>'+c+(note?' <span style="opacity:0.75;">'+note+'</span>':'')+'</span><span style="color:'+(amt<0?'var(--red)':'var(--ink)')+'">'+(amt<0?'−':'')+fmt(Math.abs(amt))+'</span>';
          card.appendChild(row);
        });
        main.appendChild(card);
      });
    }
    app.appendChild(main);
  }

  function renderShiftFormFull(app, editing, dateVal, selType, ambulance, admission, commentVal){

    subHeader(app, editing?'当直の編集':'当直メモの新規登録', ()=> editing ? go('shiftMonth',{monthKey: state.monthKey}) : go('shiftList',{}));

    main.appendChild(g1);

    main.appendChild(g2);

    const g3 = el('div','form-group');
    g3.appendChild(el('label','form-label','救急車 件数'));

    main.appendChild(g4);

    const amount = computeShiftAmount(selType, ambulance, admission);
    main.appendChild(el('div','amount-preview','<div class="num">'+yen(amount)+'</div><div class="cap">合計金額（基本'+yen(shiftBaseAmount(selType))+'＋件数'+(ambulance+admission)+'件×3000円）</div>'));

    main.appendChild(g5);

    let submitted = false;
    const saveBtn = el('button','save-btn', editing?'更新する':'登録する');
    saveBtn.onclick = async ()=>{

      } else {
        shifts.push({id:uid(), date: dateInput.value, type:selType, ambulance, admission, amount, comment});
      }
      await saveArr('memoz_shifts', shifts);
      go('shiftList',{});
    };

    if(editing){
      let deleting = false;
      const delBtn = el('button','delete-btn','削除する');
      delBtn.onclick = async ()=>{
        if(deleting) return;
        if(confirm('この記録を削除しますか？')){
          deleting = true;
          shifts = shifts.filter(s=>s.id!==editing.id);
          await saveArr('memoz_shifts', shifts);
          go('shiftList',{});
        }
      };
      main.appendChild(delBtn);
    }
    app.appendChild(main);
  }

  function makeStepperStatic(val, onChange){
    const wrap = el('div','stepper');
    const minus = el('button',null,'−');
    minus.onclick = ()=> onChange(Math.max(0, val-1));
    const valSpan = el('div','val', String(val));
    const plus = el('button',null,'＋');
    plus.onclick = ()=> onChange(val+1);
    wrap.appendChild(minus); wrap.appendChild(valSpan); wrap.appendChild(plus);
    return wrap;
  }

  function renderDishList(app){

      return;
    }
    const sorted = [...dishes].sort((a,b)=> (b.updatedAt||'').localeCompare(a.updatedAt||''));
    sorted.forEach(d=>{
      const card = el('div','dish-card');
      const latest = d.versions.length ? d.versions[d.versions.length-1] : null;
      let sub;
      if(!latest){
        sub = '<span class="status-badge">未調理</span>';
      } else {
        const dateLabel = latest.planned ? '予定' : (latest.dateCooked?fmtDate(latest.dateCooked):'日付未定');
        sub = '第'+latest.version+'版・'+dateLabel;
      }
      card.innerHTML = '<div><div class="dish-name">'+escapeHtml(d.name)+'</div><div class="dish-sub">'+sub+'</div></div><div class="dish-arrow">›</div>';
      card.onclick = ()=> go('dishDetail',{dishId:d.id});
      main.appendChild(card);
    });
    app.appendChild(main);
  }

  function renderDishDetail(app){
    const dish = dishes.find(d=>d.id===state.dishId);
    if(!dish){ go('dishList',{}); return; }
    subHeader(app, dish.name, ()=>go('dishList',{}));
    const main = el('div','main');

    const head = el('div','dish-header-card');
    let html = '<h2>'+escapeHtml(dish.name)+(dish.versions.length===0?' <span class="status-badge">未調理</span>':'')+'</h2>';
    html += urlLinksHtml(dish.links);
    if(dish.comment) html += '<div style="margin-top:8px; font-size:13px; color:var(--ink-soft);">💬 '+escapeHtml(dish.comment)+'</div>';
    head.innerHTML = html;
    const editLink = el('span','dish-edit-link','✎ 料理名・参考リンク・コメントを編集');

    if(dish.versions.length===0){
      main.appendChild(el('div','empty-state','まだバージョン（レシピ）が登録されていません。'));
    }
    const versions = [...dish.versions].sort((a,b)=>b.version-a.version);

      const card = el('div','version-card');

        ev.stopPropagation();
        if(confirm('第'+v.version+'版を削除しますか？')){
          dish.versions = dish.versions.filter(x=>x.id!==v.id);

      headRow.appendChild(delBtn);
      card.appendChild(headRow);

        go('dishList',{});

    };
    main.appendChild(delDishBtn);

    app.appendChild(main);

    const g3 = el('div','form-group');
    g3.appendChild(el('label','form-label','日付'));
    const dateInput = el('input'); dateInput.type='date'; dateInput.value = editing?(editing.date||todayStr()):todayStr();
    g3.appendChild(dateInput);
    main.appendChild(g3);

    const g4 = el('div','form-group');
    g4.appendChild(el('label','form-label','参考にしたURL（任意・1行に1つずつ）'));
    const refInput = el('textarea');
    refInput.value = editing?(editing.refUrls||[]).join('\n'):'';
    refInput.placeholder = 'https://...';
    g4.appendChild(refInput);
    main.appendChild(g4);

    const g5 = el('div','form-group');
    g5.appendChild(el('label','form-label','店・商品のURL（任意・1行に1つずつ）'));
    const shopInput = el('textarea');
    shopInput.value = editing?(editing.shopUrls||[]).join('\n'):'';
    shopInput.placeholder = 'https://...';
    g5.appendChild(shopInput);
    main.appendChild(g5);

    const g6 = el('div','form-group');
    g6.appendChild(el('label','form-label','コメント（任意）'));
    const commentInput = el('textarea');
    commentInput.value = editing?(editing.comment||''):'';
    g6.appendChild(commentInput);
    main.appendChild(g6);

    let submitted = false;
    const saveBtn = el('button','save-btn', editing?'更新する':'登録する');
    saveBtn.style.background = 'var(--coral)';
    saveBtn.onclick = async ()=>{
      if(submitted) return;
      const item = itemInput.value.trim();
      if(!item){ alert('「もの」を入力してください'); return; }
      submitted = true;
      saveBtn.disabled = true;
      saveBtn.style.opacity = '0.6';
      const refUrls = refInput.value.split('\n').map(s=>s.trim()).filter(Boolean);
      const shopUrls = shopInput.value.split('\n').map(s=>s.trim()).filter(Boolean);
      if(editing){
        editing.item = item; editing.product = productInput.value; editing.date = dateInput.value; editing.refUrls = refUrls; editing.shopUrls = shopUrls; editing.comment = commentInput.value;
      } else {
        wants.push({id:uid(), item, product:productInput.value, date:dateInput.value, refUrls, shopUrls, comment:commentInput.value});
      }
      await saveArr('memoz_wants', wants);
      go('wantList',{});
    };
    main.appendChild(saveBtn);

    if(editing){
      const delBtn = el('button','delete-btn','削除する');
      delBtn.onclick = async ()=>{
        if(confirm('この記録を削除しますか？')){
          wants = wants.filter(w=>w.id!==editing.id);
          await saveArr('memoz_wants', wants);
          go('wantList',{});
        }
      };
      main.appendChild(delBtn);
    }
    app.appendChild(main);
  }

  // ---------- SETTINGS / BACKUP ----------
  function renderSettings(app){
    subHeader(app, '設定・バックアップ', ()=>go('home',{}));
    const main = el('div','main');

    const info = el('div','settings-card');
    info.innerHTML = '<h3>データの保存について</h3><p>「やること」「当直メモ」「個人出費」「娯楽出費」のデータは、この端末のこのブラウザ（アプリ）の中に自動的に保存されます。クラウド同期はしていないため、他の端末やブラウザからは見られません。ブラウザのデータ消去や機種変更でデータが消える場合があるので、下の「バックアップ」を定期的に取ることをおすすめします。</p>';
    main.appendChild(info);

    const backupCard = el('div','settings-card');
    backupCard.innerHTML = '<h3>バックアップファイルを保存</h3><p>すべてのデータを1つのファイル（.json）に書き出せます。Googleドライブなど、この端末以外の場所にも保存しておくと安心です。</p>';
    const btnRow = el('div','settings-btn-row');
    const exportBtn = el('button','backup-btn','⬇ バックアップをダウンロード');
    exportBtn.onclick = ()=>{
      const payload = {
        exportedAt: new Date().toISOString(),
        app: 'めもーず',
        todos, shifts, personals, ents, calories, dishes, wants, places
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const now = new Date();
      const stamp = now.toISOString().slice(0,10);
      a.href = url;
      a.download = 'memoz_backup_' + stamp + '.json';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      status.textContent = 'バックアップファイルをダウンロードしました。';
    };
    btnRow.appendChild(exportBtn);
    backupCard.appendChild(btnRow);
    const status = el('div','settings-status','');
    backupCard.appendChild(status);
    main.appendChild(backupCard);

    const restoreCard = el('div','settings-card');
    restoreCard.innerHTML = '<h3>バックアップから復元</h3><p>保存しておいた .json ファイルを選ぶと、そのファイルの内容で今のデータを上書きします。機種変更や再インストール後に使えます。</p>';
    const fileId = 'restoreFile_' + uid();
    const label = el('label','restore-label','📂 ファイルを選んで復元する');
    label.htmlFor = fileId;
    const fileInput = el('input');
    fileInput.type='file'; fileInput.accept='application/json,.json'; fileInput.id = fileId;
    fileInput.style.display='none';
    const restoreStatus = el('div','settings-status','');
    fileInput.onchange = async (ev)=>{
      const file = ev.target.files[0];
      if(!file) return;
      try{
        const text = await file.text();
        const data = JSON.parse(text);
        if(!data || (!data.todos && !data.shifts && !data.personals && !data.ents && !data.calories && !data.dishes && !data.wants && !data.places)){
          restoreStatus.style.color = 'var(--red)';
          restoreStatus.textContent = 'このファイルは「めもーず」のバックアップ形式ではないようです。';
          return;
        }
        if(!confirm('現在のデータを、このファイルの内容で上書きします。よろしいですか？')) return;
        todos = data.todos || [];
        shifts = data.shifts || [];
        personals = data.personals || [];
        ents = data.ents || [];
        calories = data.calories || [];
        dishes = data.dishes || [];
        wants = data.wants || [];
        places = data.places || [];
        await Promise.all([
          saveArr('memoz_todos', todos),
          saveArr('memoz_shifts', shifts),
          saveArr('memoz_personal', personals),
          saveArr('memoz_ent', ents),
          saveArr('memoz_calories', calories),
          saveArr('memoz_dishes', dishes),
          saveArr('memoz_wants', wants),
          saveArr('memoz_places', places)
        ]);
        restoreStatus.style.color = 'var(--teal)';
        restoreStatus.textContent = '復元しました。';
      }catch(e){
        restoreStatus.style.color = 'var(--red)';
        restoreStatus.textContent = 'ファイルの読み込みに失敗しました。';
      }
    };
    restoreCard.appendChild(label);
    restoreCard.appendChild(fileInput);
    restoreCard.appendChild(restoreStatus);
    main.appendChild(restoreCard);

    app.appendChild(main);
  }

  // ---------------- INIT ----------------
  async function init(){
    [todos, shifts, personals, ents, calories, dishes, wants, places] = await Promise.all([
      loadArr('memoz_todos'),
      loadArr('memoz_shifts'),
      loadArr('memoz_personal'),
      loadArr('memoz_ent'),
      loadArr('memoz_calories'),
      loadArr('memoz_dishes'),
      loadArr('memoz_wants'),
      loadArr('memoz_places')
    ]);
    try{ history.replaceState(state, '', '#home'); }catch(e){}
    window.addEventListener('popstate', (ev)=>{
      state = ev.state || {page:'home'};
      render();
    });
    render();
  }
  init();
})();
</script>
